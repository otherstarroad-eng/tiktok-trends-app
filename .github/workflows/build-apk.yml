name: Build Android APK with Buildozer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev libreoffice-dev libmpdec-dev
        pip3 install --user --upgrade buildozer cython virtualenv

    - name: Build APK with Auto License
      run: |
        # اینڈرائیڈ ہوم کا پاتھ سیٹ کرنا
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        
        # بلڈوزر کو پہلی بار چلانا تاکہ وہ فولڈرز بنا لے
        buildozer android debug || true
        
        # اگر سڈک مینیجر موجود ہے تو تمام لائسنس آٹو قبول کرنا
        if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        elif [ -f "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true
        fi
        
        # فائنل بلڈ رن کرنا
        buildozer -v android debug
