name: Build Android APK with Buildozer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache Buildozer Packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev libreoffice-dev libmpdec-dev
        pip3 install --user --upgrade buildozer cython virtualenv

    - name: Fix SDK Manager and Build APK
      run: |
        mkdir -p ~/.buildozer/android/platform
        curl -L "https://google.com" -o commandlinetools.zip
        unzip -q commandlinetools.zip -d ~/.buildozer/android/platform/cmdline-tools
        mv ~/.buildozer/android/platform/cmdline-tools/cmdline-tools ~/.buildozer/android/platform/cmdline-tools/latest
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n8933bad161af4178b1185d1a37fd41ea5269c55" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        buildozer -v android debug
      env:
        ACCEPT_SDK_LICENSE: "y"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tiktok-trends-apk
        path: bin/*.apk
