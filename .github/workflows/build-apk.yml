name: Build Android APK with Buildozer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev libreoffice-dev libmpdec-dev
        pip3 install --user --upgrade buildozer cython virtualenv

    - name: Setup Android Command Line Tools
      run: |
        mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
        curl -L -o commandlinetools.zip https://google.com
        unzip -q commandlinetools.zip -d ~/.buildozer/android/platform/android-sdk/cmdline-tools
        mv ~/.buildozer/android/platform/android-sdk/cmdline-tools/cmdline-tools ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest

    - name: Pre-accept Android Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n8933bad161af4178b1185d1a37fd41ea5269c55\nd56f5187479451eabf01fb74fa6df2d34959d843" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

    - name: Build APK
      run: |
        # اگر فائل نہیں ہے تو خود بنا لے تاکہ ایرر نہ آئے
        if [ ! -f "buildozer.spec" ]; then
          ~/.local/bin/buildozer init
        fi
        ~/.local/bin/buildozer -v android debug
